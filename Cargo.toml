[workspace]
resolver = "2"
members = [
    "crates/db-core",
    "crates/mcp-server",
    "crates/cli",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "sqlite", "mysql", "postgres"] }
anyhow = "1.0"
regex = "1.10"
clap = { version = "4.4", features = ["derive"] }
urlencoding = "2.1"
chrono = { version = "0.4", features = ["clock"] }
async-trait = "0.1.89"
db-core = { path = "crates/db-core" }
mcp-server = { path = "crates/mcp-server" }
