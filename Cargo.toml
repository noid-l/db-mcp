[package]
name = "db-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "sqlite", "mysql", "postgres"] }
anyhow = "1.0"
regex = "1.10"
clap = { version = "4.4", features = ["derive"] }
urlencoding = "2.1"
chrono = { version = "0.4", features = ["clock"] }
